name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Verify the tag matches Cargo.toml version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/v}"
          # Reject anything that isn't strict semver before letting it
          # near a shell expansion. Pre-release / build suffixes allowed.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "rejecting tag: not a valid semver string"
            exit 1
          fi
          manifest=$(cargo pkgid | sed -E 's/.*[#@]([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')
          if [ "$tag" != "$manifest" ]; then
            printf 'tag does not match Cargo.toml version: tag=%q manifest=%q\n' "$tag" "$manifest"
            exit 1
          fi
          echo "version: $manifest"

      - name: Mint short-lived crates.io token via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
